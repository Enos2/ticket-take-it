services:
  postgres:
    image: postgres:17-alpine
    container_name: ticket-take-it-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket_take_it
      POSTGRES_USER: ticket_take_it
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "5432:5432"
    volumes:
      - ticket_take_it_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_take_it -d ticket_take_it"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ticket-take-it-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ticket_take_it_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ticket_take_it_postgres:
  ticket_take_it_redis:
